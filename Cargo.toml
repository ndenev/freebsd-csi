[workspace]
resolver = "3"
members = [
    "ctld-agent",
    "csi-driver",
]

[workspace.package]
version = "0.4.6"
edition = "2024"
license = "BSD-2-Clause"
repository = "https://github.com/ndenev/freebsd-csi"

[workspace.dependencies]
tokio = { version = "1.53.2", features = ["full"] }
tonic = { version = "0.14.6", features = ["tls-ring"] }
prost = "0.14.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
prost-types = "0.14.4"
uuid = { version = "1.27.0", features = ["v4"] }
hostname = "0.4.2"
